<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ember & Iron — Phase 1 (Web Prototype)</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0b0b0c; overflow:hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #game { position:fixed; inset:0; }
    #hud {
      position:fixed; left:10px; top:10px; z-index:10;
      color:#e8e6df; font-size:14px; line-height:1.25;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      max-width: 360px;
      user-select:none;
    }
    #bars { display:grid; gap:6px; margin-top:6px; }
    .barRow { display:grid; grid-template-columns: 86px 1fr 44px; gap:8px; align-items:center; }
    .barOuter { height:10px; border-radius:999px; background: rgba(255,255,255,0.10); overflow:hidden; border:1px solid rgba(255,255,255,0.08); }
    .barInner { height:100%; width:50%; background: linear-gradient(90deg, #ff8a00, #ffd000); }
    .barInner.blue { background: linear-gradient(90deg, #1f8fff, #6fd3ff); }
    .barInner.red { background: linear-gradient(90deg, #ff3b3b, #ff8a8a); }
    .tiny { opacity:0.85; font-size:12px; }
    #toast {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      z-index:20; color:#f3f0e8;
      background: rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.14);
      padding: 10px 12px; border-radius: 14px;
      max-width:min(560px, calc(100vw - 24px));
      text-align:center; pointer-events:none;
      opacity:0; transition: opacity 160ms ease;
      user-select:none;
    }
    #toast.show { opacity:1; }
    #help { margin-top:8px; }
    .kbd { display:inline-block; padding:1px 6px; border-radius:6px; border:1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); font-size:12px; }
    a { color:#9ad1ff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
      <div style="font-weight:700;">Ember & Iron</div>
      <div class="tiny" id="zone">Union Border Outpost</div>
    </div>
    <div class="tiny" id="status">Booting…</div>

    <div id="bars"></div>

    <div id="inv" style="margin-top:8px;" class="tiny"></div>

    <div id="help" class="tiny">
      <span class="kbd">WASD</span> move • <span class="kbd">Shift</span> sprint •
      <span class="kbd">1</span> eat • <span class="kbd">2</span> drink •
      <span class="kbd">C</span> camp
      <div style="margin-top:4px; opacity:0.8;">Tip: pick up glowing cubes to stock supplies. Weight is a villain with a clipboard.</div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
